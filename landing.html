<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TIMASLA — Football, Live. Smarter.</title>
<meta name="description" content="Real-time scores, breaking news, fixtures and where to watch every match.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090D;--tx:#F4F6F8;--mu:#8B93A1;--gl:rgba(255,255,255,.055);--bd:rgba(255,255,255,.09);--g:#2BD96B;--c:#4CC9F0;--r:18px;--p:18px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#F3F5F7;--tx:#0B0F14;--mu:#5C6573;--gl:rgba(255,255,255,.7);--bd:rgba(0,0,0,.09)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#F3F5F7;--tx:#0B0F14;--mu:#5C6573;--gl:rgba(255,255,255,.7);--bd:rgba(0,0,0,.09)}}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:400 15px/1.5 Inter,system-ui,sans-serif;min-height:100vh;overflow-x:hidden;
background-image:radial-gradient(600px 400px at 15% -5%,rgba(43,217,107,.12),transparent),radial-gradient(500px 400px at 95% 10%,rgba(76,201,240,.08),transparent);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
.glass{background:var(--gl);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--bd);border-radius:var(--r)}
.card{padding:var(--p);transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-2px);border-color:rgba(43,217,107,.35)}
nav.side{position:fixed;left:16px;top:16px;bottom:16px;width:76px;display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px;z-index:5}
.logo{font-weight:800;font-size:10px;letter-spacing:.14em;text-align:center;margin-bottom:12px}.logo i{display:block;width:26px;height:26px;border-radius:50%;border:2px solid var(--g);margin:0 auto 6px;position:relative}.logo i:after{content:"";position:absolute;inset:6px;background:var(--g);clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
.nb{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 6px;border-radius:12px;color:var(--mu);font-size:10px;cursor:pointer;width:62px}
.nb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb.on{color:var(--g);background:rgba(43,217,107,.1)}.nb:hover{color:var(--tx)}.sp{flex:1}
main{margin-left:108px;padding:20px 28px 40px;max-width:1240px}
.top{display:flex;justify-content:flex-end;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.top select,.top button{background:var(--gl);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;cursor:pointer;font-size:13px}
.top select option{color:#000}
h1{font-size:clamp(34px,6vw,64px);line-height:1.04;letter-spacing:-.03em;font-weight:800}h1 em{font-style:normal;color:var(--g)}
h2{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:36px 0 14px;display:flex;align-items:center;gap:10px}
.sub{color:var(--mu);font-size:clamp(15px,2vw,18px);margin-top:12px;max-width:620px}
.ai{display:flex;gap:10px;padding:8px 8px 8px 18px;margin-top:28px;max-width:720px;align-items:center}
.ai input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;padding:10px 0}
.btn{background:var(--g);color:#04170B;border:0;border-radius:12px;padding:10px 18px;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--gl);color:var(--tx);border:1px solid var(--bd)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{font-size:12px;color:var(--mu);border:1px solid var(--bd);border-radius:99px;padding:5px 12px;cursor:pointer;background:none}.chip:hover,.chip.on{color:var(--g);border-color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--g);font-size:12px;font-weight:600;letter-spacing:.08em}.live:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--g);animation:pl 1.8s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(43,217,107,.6)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.meta{font-size:12px;color:var(--mu)}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}.tag.CONFIRMED{color:var(--g)}.tag.REPORTED{color:#F2C14E}.tag.RUMOUR{color:var(--mu)}
.state{padding:28px;text-align:center;color:var(--mu)}.state b{display:block;color:var(--tx);margin-bottom:12px}
.sk{height:120px;border-radius:var(--r);background:linear-gradient(100deg,var(--gl) 30%,rgba(255,255,255,.1) 50%,var(--gl) 70%);background-size:300% 100%;animation:sh 1.4s infinite;border:1px solid var(--bd)}
@keyframes sh{to{background-position:-150% 0}}
.view{animation:fi .3s ease}@keyframes fi{from{opacity:0;transform:translateY(6px)}}
.bar{height:6px;border-radius:9px;background:var(--bd);overflow:hidden;display:flex}.bar i{background:var(--g)}
.score{font-weight:800;font-size:30px;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0}.tabs .chip{white-space:nowrap}
footer{margin-top:60px;padding-top:24px;border-top:1px solid var(--bd);color:var(--mu);font-size:13px}footer b{color:var(--tx);letter-spacing:.14em}footer a{color:var(--mu);margin-right:14px;text-decoration:none}
.bn{display:none}
@media(max-width:820px){nav.side{display:none}main{margin:0;padding:14px 16px 100px}
.bn{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));justify-content:space-around;padding:6px;z-index:5}.bn .nb{width:auto;flex:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<nav class="side glass" id="side"></nav>
<nav class="bn glass" id="bn"></nav>
<main><div class="top">
<select id="country" aria-label="Country"></select>
<button id="demo" aria-label="Demo mode">Demo</button>
<button id="theme" aria-label="Toggle theme">Theme</button></div>
<div id="dbn" class="glass" style="display:none;padding:10px 16px;margin-bottom:14px;border-color:var(--g);font-size:13px"><b style="color:var(--g)">DEMO</b> — أخبار تجريبية للعرض فقط، وليست بيانات حقيقية.</div>
<div id="app" class="view"></div>
<footer><b>TIMASLA</b><p style="margin:6px 0 14px">Football, Live. Smarter.</p>
<a href="#">About</a><a href="#">Privacy</a><a href="#">Terms</a><a href="#">Contact</a><a href="#">Sources</a>
<p style="margin-top:14px">© 2026 Timasla. Match data belongs to its providers.</p></footer></main>
<script>
/* ---------- Data / service layer: swap base URL or provider here. Keys live server-side only. ---------- */
const Data={base:'/api/football',
 async get(p){const r=await fetch(this.base+p,{headers:{Accept:'application/json'}});if(!r.ok)throw new Error(r.status);const j=await r.json();if(!Array.isArray(j.items))throw new Error('bad shape');return j.items},
 live:()=>Data.get('/live'),matches:()=>Data.get('/matches'),news:()=>DEMO?Promise.resolve(DEMO_NEWS()):Data.get('/news'),transfers:()=>Data.get('/transfers'),
 watch:(id,c)=>Data.get('/watch?match='+encodeURIComponent(id)+'&country='+c)};
let DEMO=localStorage.getItem('tm_demo')!=='0';
const ago=m=>new Date(Date.now()-m*60000).toISOString();
const DEMO_NEWS=()=>[
{category:'TRANSFER',certainty:'CONFIRMED',headline:'[DEMO] نادي تجريبي A يعلن تعاقده مع لاعب وسط',summary:'خبر تجريبي لعرض شكل بطاقة الخبر المؤكد. ليس خبرا حقيقيا.',source:'Demo Source',publishedAt:ago(2)},
{category:'TRANSFER',certainty:'REPORTED',headline:'[DEMO] تقارير عن اهتمام نادي تجريبي B بمهاجم',summary:'خبر تجريبي لعرض حالة REPORTED. لا يعتمد على أي مصدر حقيقي.',source:'Demo Media',publishedAt:ago(25)},
{category:'TRANSFER',certainty:'RUMOUR',headline:'[DEMO] إشاعة: انتقال محتمل لحارس مرمى',summary:'خبر تجريبي لعرض حالة RUMOUR، وهي لا تُقدَّم كحقيقة أبدا.',source:'Demo Forum',publishedAt:ago(90)},
{category:'MATCH',certainty:'CONFIRMED',headline:'[DEMO] تأجيل مباراة تجريبية بسبب الأحوال الجوية',summary:'مثال على خبر رسمي من اتحاد تجريبي.',source:'Demo Federation',publishedAt:ago(180)},
{category:'INJURY',certainty:'REPORTED',headline:'[DEMO] إصابة محتملة لقائد فريق تجريبي',summary:'مثال لعرض تصنيف الإصابات.',source:'Demo Club',publishedAt:ago(300)},
{category:'COMPETITION',certainty:'CONFIRMED',headline:'[DEMO] الإعلان عن جدول جولة تجريبية',summary:'مثال على خبر صادر عن مسابقة رسمية.',source:'Demo League',publishedAt:ago(600)}];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TZ=Intl.DateTimeFormat().resolvedOptions().timeZone;
const COUNTRIES={MA:'Morocco',FR:'France',GB:'UK',US:'USA',ES:'Spain',DE:'Germany',IT:'Italy',SA:'Saudi Arabia',AE:'UAE',QA:'Qatar',EG:'Egypt'};
const TZC={'Africa/Casablanca':'MA','Europe/Paris':'FR','Europe/London':'GB','Europe/Madrid':'ES','Europe/Berlin':'DE','Europe/Rome':'IT','Asia/Riyadh':'SA','Asia/Dubai':'AE','Asia/Qatar':'QA','Africa/Cairo':'EG'};
let CC=localStorage.getItem('tm_cc')||TZC[TZ]||(TZ.startsWith('America/')?'US':'GB');
const time=iso=>new Intl.DateTimeFormat([], {hour:'2-digit',minute:'2-digit',timeZone:TZ}).format(new Date(iso));
const I={home:'M3 11l9-8 9 8v10H3z',live:'M12 12m-2 0a2 2 0 104 0a2 2 0 10-4 0M5 5a10 10 0 000 14M19 5a10 10 0 010 14',matches:'M3 5h18v14H3zM3 10h18',news:'M4 4h14v16H4zM8 9h6M8 13h6',comp:'M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0zM4 5h3M17 5h3',tr:'M4 8h14l-3-3M20 16H6l3 3',search:'M11 4a7 7 0 100 14 7 7 0 000-14zM21 21l-5-5'};
const NAV=[['home','Home'],['live','Live'],['matches','Matches'],['news','News'],['comp','Competitions'],['tr','Transfers']];
const ROUTE={home:'home',live:'live',matches:'matches',news:'news',comp:'competitions',tr:'transfers'};
const btn=(k,l)=>`<button class="nb" data-r="${ROUTE[k]||k}"><svg viewBox="0 0 24 24"><path d="${I[k]}"/></svg>${l}</button>`;
side.innerHTML='<div class="logo"><i></i>TIMASLA</div>'+NAV.map(([k,l])=>btn(k,l.replace('Competitions','Comps'))).join('')+'<div class="sp"></div>'+btn('search','Search');
bn.innerHTML=[['home','Home'],['live','Live'],['matches','Matches'],['news','News'],['search','Search']].map(([k,l])=>btn(k,l)).join('');
country.innerHTML=Object.entries(COUNTRIES).map(([k,v])=>`<option value="${k}" ${k==CC?'selected':''}>${v}</option>`).join('');
country.onchange=()=>{CC=country.value;localStorage.setItem('tm_cc',CC);render()};
theme.onclick=()=>{const d=document.documentElement;d.dataset.theme=(d.dataset.theme||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'))=='dark'?'light':'dark'};
document.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(b){location.hash=b.dataset.r}});
/* ---------- UI helpers ---------- */
const skel=n=>`<div class="grid">${'<div class="sk"></div>'.repeat(n)}</div>`;
const err=(fn)=>`<div class="glass state"><b>Unable to load live football data.</b><button class="btn" onclick="${fn}()">Try again</button><p class="meta" style="margin-top:12px">No data is shown unless it comes from a verified source.</p></div>`;
const empty=t=>`<div class="glass state">${t}</div>`;
async function load(el,fn,draw,rerun){el.innerHTML=skel(3);try{const d=await fn();el.innerHTML=d.length?draw(d):empty('Nothing to show right now.')}catch(e){el.innerHTML=err(rerun)}}
const matchCard=m=>`<a class="glass card" style="display:block;text-decoration:none;color:inherit" href="#match/${esc(m.id)}">
<div class="row meta"><span>${esc(m.competition)}</span>${m.status==='LIVE'?`<span class="live">${esc(m.minute)}'</span>`:`<span>${esc(m.status==='FT'?'Full time':time(m.kickoff))}</span>`}</div>
<div class="row" style="margin-top:12px"><span>${esc(m.home?.name)}</span><span class="score">${esc(m.home?.score??'')}</span></div>
<div class="row"><span>${esc(m.away?.name)}</span><span class="score">${esc(m.away?.score??'')}</span></div></a>`;
const COL={TRANSFER:['#0f3d2a','#2BD96B'],MATCH:['#0d2a3f','#4CC9F0'],INJURY:['#3a1d1d','#ff6b6b'],COMPETITION:['#2a2340','#a78bfa']};
const pic=(n)=>{const [a,b]=COL[n.category]||COL.MATCH,k=[...String(n.headline)].reduce((x,c)=>x+c.charCodeAt(0),0)%60;
const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="#07090D"/></linearGradient></defs><rect width="640" height="360" fill="url(#g)"/><g fill="none" stroke="${b}" stroke-opacity=".35" stroke-width="2"><rect x="40" y="40" width="560" height="280" rx="8"/><path d="M320 40v280"/><circle cx="320" cy="180" r="56"/><rect x="40" y="120" width="70" height="120"/><rect x="530" y="120" width="70" height="120"/></g><circle cx="${200+k*4}" cy="${120+k}" r="22" fill="${b}"/><circle cx="${200+k*4}" cy="${120+k}" r="22" fill="none" stroke="#07090D" stroke-width="3" stroke-dasharray="8 6"/></svg>`;
return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg)};
const newsCard=n=>`<article class="glass card"><img src="${/^(https:\/\/|data:image\/)/.test(n.image||'')?esc(n.image):pic(n)}" alt="" loading="lazy" style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;margin-bottom:12px"><div class="row"><span class="meta">${esc(n.category)}</span><span class="tag ${esc(n.certainty)}">${esc(n.certainty)}</span></div>
<h3 style="font-size:16px;margin:10px 0 6px">${esc(n.headline)}</h3><p class="meta">${esc(n.summary)}</p><p class="meta" style="margin-top:10px">${esc(n.source)} · ${esc(n.publishedAt?new Date(n.publishedAt).toLocaleString():'')}</p></article>`;
/* ---------- Views ---------- */
const V={
home(){app.innerHTML=`<h1>Football, <em>Live.</em><br>Smarter.</h1>
<p class="sub">Real-time scores, breaking news, fixtures and where to watch every match.</p>

<h2><span class="live">LIVE NOW</span></h2><div id="lv"></div>
<h2>Breaking Football News</h2><div id="nw"></div>`;
window.rl=()=>load(lv,Data.live,d=>`<div class="grid">${d.map(matchCard).join('')}</div>`,'rl');
window.rn=()=>load(nw,Data.news,d=>`<div class="grid">${d.slice(0,6).map(newsCard).join('')}</div>`,'rn');rl();rn()},
live(){app.innerHTML=`<h2 style="margin-top:8px"><span class="live">LIVE NOW</span></h2><div id="lv"></div>`;
window.rl=()=>load(lv,Data.live,d=>`<div class="grid">${d.map(matchCard).join('')}</div>`,'rl');rl();
V.t=setInterval(()=>Data.live().then(d=>{if(lv&&d.length)lv.innerHTML=`<div class="grid">${d.map(matchCard).join('')}</div>`}).catch(()=>{}),30000)},
matches(){app.innerHTML=`<h2 style="margin-top:8px">Today's Matches</h2><div class="tabs" id="tb">${['All','Live','Upcoming','Finished'].map((t,i)=>`<button class="chip ${i?'':'on'}" data-f="${t}">${t}</button>`).join('')}</div><div id="ml"></div>`;
let all=[],f='All';const st={Live:'LIVE',Upcoming:'NS',Finished:'FT'};
const draw=()=>{const d=all.filter(m=>f=='All'||m.status==st[f]);const g={};d.forEach(m=>(g[m.competition]??=[]).push(m));
ml.innerHTML=d.length?Object.entries(g).map(([c,ms])=>`<h2 style="font-size:16px;margin:22px 0 10px">${esc(c)}</h2><div class="grid">${ms.map(matchCard).join('')}</div>`).join(''):empty('No matches in this view.')};
tb.onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;f=b.dataset.f;tb.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c==b));draw()};
window.rm=async()=>{ml.innerHTML=skel(3);try{all=await Data.matches();draw()}catch{ml.innerHTML=err('rm')}};rm()},
news(){app.innerHTML=`<h2 style="margin-top:8px">Breaking Football News</h2><p class="meta" style="margin-bottom:14px">Official clubs, competitions and federations first. Every item is labelled CONFIRMED, REPORTED or RUMOUR.</p><div id="nw"></div>`;
window.rn=()=>load(nw,Data.news,d=>`<div class="grid">${d.map(newsCard).join('')}</div>`,'rn');rn()},
transfers(){app.innerHTML=`<h2 style="margin-top:8px">Transfer Center</h2><div class="tabs" id="tb">${['Latest','Confirmed','Rumours'].map((t,i)=>`<button class="chip ${i?'':'on'}" data-f="${t}">${t}</button>`).join('')}</div><div id="tl"></div>`;
let all=[],f='Latest';const draw=()=>{const d=all.filter(t=>f=='Latest'||t.status==(f=='Confirmed'?'CONFIRMED':'RUMOUR'));
tl.innerHTML=d.length?`<div class="grid">${d.map(t=>`<div class="glass card"><div class="row"><b>${esc(t.player)}</b><span class="tag ${esc(t.status)}">${esc(t.status)}</span></div><p class="meta" style="margin-top:8px">${esc(t.from)} → ${esc(t.to)}</p><p class="meta">Fee: ${esc(t.fee||'Undisclosed')} · ${esc(t.source)}</p></div>`).join('')}</div>`:empty('No transfers in this view.')};
tb.onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;f=b.dataset.f;tb.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c==b));draw()};
window.rt=async()=>{tl.innerHTML=skel(3);try{all=await Data.transfers();draw()}catch{tl.innerHTML=err('rt')}};rt()},
competitions(){const c=[['UEFA Champions League','🏆'],['Premier League','🇬🇧'],['La Liga','🇪🇸'],['Serie A','🇮🇹'],['Bundesliga','🇩🇪'],['Ligue 1','🇫🇷'],['Botola Pro','🇲🇦']];
app.innerHTML=`<h2 style="margin-top:8px">Competitions</h2><div class="grid">${c.map(([n,e])=>`<div class="glass card"><div style="font-size:26px">${e}</div><h3 style="font-size:17px;margin:8px 0">${n}</h3><p class="meta">Matchday, standings and fixtures appear here once a data provider is connected.</p></div>`).join('')}</div>`},
search(){app.innerHTML=`<h2 style="margin-top:8px">Search</h2><form class="glass ai" id="sf"><input id="sq" placeholder="Players, clubs, matches, competitions, news" aria-label="Search"><button class="btn">Search</button></form><div id="sr" style="margin-top:16px"></div>`;
sf.onsubmit=async e=>{e.preventDefault();sr.innerHTML=skel(2);try{const d=await Data.get('/search?q='+encodeURIComponent(sq.value));sr.innerHTML=d.length?`<div class="grid">${d.map(x=>`<div class="glass card"><b>${esc(x.title)}</b><p class="meta">${esc(x.type)}</p></div>`).join('')}</div>`:empty('No results.')}catch{sr.innerHTML=err('V.search')}}},
match(id){app.innerHTML=`<div id="mh"></div><div class="tabs" id="tb">${['Overview','Events','Stats','Lineups','News','Where to Watch'].map((t,i)=>`<button class="chip ${i?'':'on'}" data-t="${t}">${t}</button>`).join('')}</div><div id="mt"></div>`;
let m=null;const show=t=>{
if(t=='Where to Watch'){mt.innerHTML=skel(1);Data.watch(id,CC).then(d=>{mt.innerHTML=d.length?`<div class="grid">${d.map(w=>`<div class="glass card"><b>${esc(COUNTRIES[CC])}</b><p style="margin:8px 0">${esc(w.tv)}${w.stream?'<br>'+esc(w.stream):''}</p>${/^https:\/\//.test(w.url||'')?`<a class="btn" style="display:inline-block;text-decoration:none" href="${esc(w.url)}" target="_blank" rel="noopener">Watch Officially</a>`:''}</div>`).join('')}</div>`:empty('No verified official broadcaster found for your region.')}).catch(()=>mt.innerHTML=empty('No verified official broadcaster found for your region.<p class="meta" style="margin-top:8px">Change country above to check another region.</p>'));return}
if(!m){mt.innerHTML=empty('Match data unavailable.');return}
if(t=='Stats'){const S=m.stats||[];mt.innerHTML=S.length?`<div class="glass card">${S.map(s=>{const a=+s.home,b=+s.away,p=a+b?a/(a+b)*100:50;return`<div style="margin:12px 0"><div class="row meta"><b style="color:var(--tx)">${esc(s.home)}</b><span>${esc(s.label)}</span><b style="color:var(--tx)">${esc(s.away)}</b></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')}</div>`:empty('Statistics not available yet.');return}
const k={Overview:m.overview,Events:m.events,Lineups:m.lineups,News:m.news}[t];
mt.innerHTML=k&&k.length?`<div class="glass card">${k.map(x=>`<p>${esc(typeof x=='string'?x:x.text||JSON.stringify(x))}</p>`).join('')}</div>`:empty('Not available yet.')};
tb.onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;tb.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c==b));show(b.dataset.t)};
